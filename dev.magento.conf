<VirtualHost *:80>
         
         ServerName magento.local
         ServerAlias magento.local
         DocumentRoot /var/www/html/magento/pub
         ErrorLog ${APACHE_LOG_DIR}/error.log
         CustomLog ${APACHE_LOG_DIR}/access.log combined




        <Directory /var/www/html/magento/pub>
                Options Indexes FollowSymLinks MultiViews
                AllowOverride All
                Require all granted
        </Directory>


        <FilesMatch \.php$>
                SetHandler "proxy:unix:/run/php/phpX.X-fpm.sock|fcgi://localhost/"
        </FilesMatch>

#        <LocationMatch "^/(.*\.php(/.*)?)$">
#               ProxyPass fcgi://127.0.0.1:9000/var/www/html/magento/pub/$1
#        </LocationMatch>
</VirtualHost>
